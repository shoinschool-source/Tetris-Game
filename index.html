<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Drop Game - Admin & Custom QR Setup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1147, #3b1b6e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-y: auto; 
            padding: 20px 10px;
        }

        #game-container {
            width: 720px;
            max-width: 100%;
            background-color: rgba(25, 15, 55, 0.9);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), inset 0 2px 6px rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 4px solid #ff7b00;
            margin: auto;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ffe600;
            font-size: 38px;
            text-shadow: 3px 3px 0px #ff0055, 5px 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(to bottom, #ff3366, #cc0044);
            color: white;
            border: 3px solid #ffcc00;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 6px 0 #990033, 0 8px 15px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin: 5px;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #990033, 0 4px 8px rgba(0,0,0,0.4);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #00ccff, #0066cc);
            border-color: #ffff00;
            box-shadow: 0 6px 0 #003366, 0 8px 15px rgba(0,0,0,0.4);
        }

        .admin-form-group {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00ffff;
            border-radius: 14px;
            padding: 15px;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 900;
        }

        .admin-control-row label {
            color: #00ffff;
        }

        .admin-control-row input, .admin-control-row select {
            background: #11082b;
            border: 2px solid #ffcc00;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 14px;
            width: 130px;
            text-align: center;
        }

        #qr-display-box {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #qr-display-box img {
            display: block;
            width: 180px;
            height: 180px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 2px 2px 0px #000;
        }

        #prominent-timer-bar {
            width: 100%;
            background: linear-gradient(to bottom, #ff0055, #990033);
            color: white;
            text-align: center;
            padding: 5px;
            font-weight: 900;
            font-size: 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 2px solid #ffcc00;
            box-shadow: 0 3px 0 #660022;
        }

        .game-main-layout {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #right-sidebar {
            width: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #side-msg-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .side-message-box {
            background: rgba(20, 10, 40, 0.95);
            border: 3px solid #ff00ea;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 13px;
            font-weight: 900;
            text-align: center;
            color: #00ffff;
            text-shadow: 1px 1px 2px #000;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            box-shadow: 0 6px 15px rgba(255,0,234,0.3);
            width: 100%;
        }

        .side-message-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        #tetris-matrix {
            width: 480px;
            height: 440px;
            border: 4px solid #ffcc00;
            border-radius: 18px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(10, 1fr);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            transition: background 0.5s ease;
            flex-shrink: 0;
        }

        .bg-level-1 { background: radial-gradient(circle, #ff9966 0%, #ff5e62 100%); }
        .bg-level-2 { background: radial-gradient(circle, #00b09b 0%, #96c93d 100%); }
        .bg-level-3 { background: radial-gradient(circle, #4e54c8 0%, #8f94fb 100%); }

        .grid-cell {
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .word-block, .shelf-tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.6), 0 4px 8px rgba(0,0,0,0.4);
            text-align: center;
            padding: 2px 4px;
            white-space: nowrap;
            border: 2px solid rgba(255,255,255,0.8);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .type-subject { background: radial-gradient(circle at 30% 30%, #6366f1, #4338ca); color: #fff; }
        .type-verb { background: radial-gradient(circle at 30% 30%, #10b981, #047857); color: #fff; }
        .type-object { background: radial-gradient(circle at 30% 30%, #f97316, #c2410c); color: #fff; }
        .type-preposition { background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04); color: #1a1a2e; border-color: #fff; }

        #sentence-zone {
            width: 100%;
            min-height: 52px;
            background-color: rgba(15, 10, 35, 0.8);
            border: 3px dashed #00ffff;
            border-radius: 14px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            padding: 6px;
            gap: 6px;
            flex-wrap: wrap;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .drop-zone-placeholder {
            color: #a5b4fc;
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            text-align: center;
        }

        .shelf-tile {
            position: relative;
            height: 34px;
            padding: 0 8px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 11px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            width: 100%;
        }

        .controls .btn {
            flex: 1;
            padding: 8px;
            font-size: 15px;
        }

        .feedback-msg {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 900;
            min-height: 18px;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
        }

        .feedback-success { color: #4ade80; }
        .feedback-error { color: #f87171; }

        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #241445, #3c1e6e);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #00ffff;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-content h2 {
            color: #ffe600;
            font-size: 20px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #000;
        }

        .modal-content p {
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-example-group {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 6px;
            border-left: 4px solid #00ffff;
        }

        .modal-example-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            flex-wrap: wrap;
        }

        .modal-word-block {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            font-weight: 900;
            font-size: 11px;
            padding: 3px 6px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
            user-select: none;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .game-over-overlay { opacity: 0.3; }

        #game-over-banner {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            color: #ff3366;
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255,0,0,0.8);
            display: none;
            z-index: 50;
        }

        #game-over-banner.show { display: block; }

        #results-modal-overlay, #game-clear-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            z-index: 110;
        }

        .results-content, .clear-content {
            background: linear-gradient(135deg, #241445, #3c1e6e);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #ff3366;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .results-content h2, .clear-content h2 {
            color: #00ffff;
            margin-bottom: 12px;
            font-size: 24px;
            text-shadow: 2px 2px 0px #000;
        }

        .trophy-display {
            font-size: 48px;
            margin: 10px 0;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.6));
        }

        .trophy-row-grid {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
        }

        .trophy-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 900;
        }

        .trophy-item span {
            font-size: 28px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- START / MODE SELECTOR SCREEN -->
    <div id="start-screen" class="screen">
        <h1>Word Drop</h1>
        <p style="margin-bottom: 15px; text-align: center; color: #cbd5e1; font-size: 12px; font-weight: 700; line-height: 1.5;">
            教師用管理画面からレベルごとの落下速度や制限時間をカスタマイズし、学生用のQRコードを生成できます。
        </p>
        <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
            <button class="btn" onclick="openAdminScreen()" style="flex:1;">教師用設定 (Admin)</button>
            <button class="btn btn-secondary" onclick="startDirectPlay()" style="flex:1;">すぐにプレイ</button>
        </div>
    </div>

    <!-- ADMIN / CONFIG SCREEN -->
    <div id="admin-screen" class="screen hidden">
        <h1>Teacher Admin</h1>
        
        <div class="admin-form-group">
            <div class="admin-control-row">
                <label for="admin-minutes">1ラウンドの時間:</label>
                <select id="admin-minutes">
                    <option value="0.5">30秒 (テスト用)</option>
                    <option value="1">1分</option>
                    <option value="2" selected>2分 (標準A1)</option>
                    <option value="3">3分</option>
                    <option value="5">5分</option>
                </select>
            </div>
            <div class="admin-control-row">
                <label for="admin-speed-1">Lv 1 落下速度 (ms):</label>
                <input type="number" id="admin-speed-1" value="3000" step="100" min="500" max="10000">
            </div>
            <div class="admin-control-row">
                <label for="admin-speed-2">Lv 2 落下速度 (ms):</label>
                <input type="number" id="admin-speed-2" value="3000" step="100" min="500" max="10000">
            </div>
            <div class="admin-control-row">
                <label for="admin-speed-3">Lv 3 落下速度 (ms):</label>
                <input type="number" id="admin-speed-3" value="3000" step="100" min="500" max="10000">
            </div>
        </div>

        <button class="btn" onclick="generateStudentQR()" style="width: 100%;">学生用 QRコード生成</button>
        <button class="btn btn-secondary" onclick="backToStart()" style="width: 100%; margin-top: 5px;">もどる</button>
    </div>

    <!-- QR CODE SCREEN FOR STUDENTS -->
    <div id="qr-screen" class="screen hidden">
        <h1>生徒用 QRコード</h1>
        <p style="font-size: 12px; font-weight: 700; color: #cbd5e1; text-align: center; margin-bottom: 5px;">
            学生にこのQRコードをスキャンしてもらうと、設定された速度と制限時間でゲームが始まります。
        </p>
        <div id="qr-display-box">
            <img id="qr-code-img" alt="Student Game QR Code">
        </div>
        <p id="qr-url-text" style="font-size: 10px; color: #94a3b8; word-break: break-all; text-align: center; margin-bottom: 10px; max-width: 90%;"></p>
        
        <div style="display: flex; gap: 10px; width: 100%;">
            <button class="btn btn-secondary" onclick="openAdminScreen()" style="flex:1;">設定を変える</button>
            <button class="btn" onclick="launchCustomGameFromAdmin()" style="flex:1;">この設定でプレイ</button>
        </div>
    </div>

    <!-- PLAY SCREEN -->
    <div id="play-screen" class="screen hidden">
        <div class="header-bar">
            <span id="level-indicator">レベル 1</span>
            <span></span>
            <span id="height-display">ブロック数: 0</span>
        </div>

        <div id="prominent-timer-bar">
            TIME LEFT: <span id="prominent-timer-display">02:00</span>
        </div>

        <div class="game-main-layout">
            <div class="left-panel" style="position: relative;">
                <div id="tetris-matrix" class="bg-level-1"></div>
                <div id="game-over-banner">GAME OVER</div>
            </div>

            <div id="right-sidebar">
                <div id="side-msg-container"></div>
            </div>
        </div>

        <div id="sentence-zone">
            <span class="drop-zone-placeholder">ブロックをタップして英文を組み立てる...</span>
        </div>

        <div class="feedback-msg" id="feedback-msg"></div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="clearShelf()">クリア</button>
            <button class="btn" onclick="checkAnswer()">判定</button>
        </div>
    </div>

    <!-- LEVEL MODAL -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">レベル 1</h2>
            <p id="modal-body"></p>
            <div id="modal-examples" style="font-size: 12px;"></div>
            <button class="btn" style="width: 100%; margin-top: 8px;" onclick="closeModal()">スタート</button>
        </div>
    </div>

    <!-- LEVEL RESULTS / TROPHY MODAL -->
    <div id="results-modal-overlay" class="hidden">
        <div class="results-content">
            <h2 id="results-title">レベルクリア！</h2>
            <p id="results-score-text" style="font-size: 15px; font-weight: 900; margin-bottom: 8px;"></p>
            <div class="trophy-display" id="results-trophy">🏆</div>
            <p id="results-trophy-name" style="font-weight: 900; color: #ffe600; font-size: 16px; margin-bottom: 12px; text-shadow: 1px 1px 2px #000;"></p>
            <button class="btn" style="width: 100%;" onclick="proceedToNextLevel()">次のレベルへ</button>
        </div>
    </div>

    <!-- GAME CLEAR SCREEN (AFTER LEVEL 3) -->
    <div id="game-clear-overlay" class="hidden">
        <div class="clear-content">
            <h2>🎉 ALL CLEAR! 🎉</h2>
            <p style="font-size: 15px; font-weight: 900; color: #ffe600; margin-bottom: 10px;">
                総獲得ポイント: <span id="final-total-score">0</span> 点
            </p>
            <div class="trophy-row-grid">
                <div class="trophy-item">
                    Lv 1
                    <span id="final-trophy-1">🏆</span>
                </div>
                <div class="trophy-item">
                    Lv 2
                    <span id="final-trophy-2">🏆</span>
                </div>
                <div class="trophy-item">
                    Lv 3
                    <span id="final-trophy-3">🏆</span>
                </div>
            </div>
            <button class="btn" style="width: 100%; margin-bottom: 5px;" onclick="restartFasterChallenge()">もっと速く再挑戦する (+20%速い)</button>
            <button class="btn btn-secondary" style="width: 100%;" onclick="backToMenuFromClear()">タイトルに戻る</button>
        </div>
    </div>
</div>

<audio id="bgm" src="audio/soundtrack.mp3" loop></audio>

<script>
    const SUBJECTS = ["I", "You", "We", "They", "He", "She", "Ken", "Yumi", "The teacher", "The boys", "The girls", "Tom and Bob"];
    const THIRD_PERSON_SUBJECTS = new Set(["He", "She", "Ken", "Yumi", "The teacher"]);
    const INTRANSITIVE_VERBS = new Set(["run", "runs", "swim", "swims", "sleep", "sleeps"]);

    const VERB_OBJECT_PAIRS = {
        "like": [{ text: "cats" }, { text: "dogs" }, { text: "apples" }, { text: "bananas" }, { text: "books" }, { text: "comics" }, { text: "movies" }, { text: "TV" }, { text: "anime" }, { text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "likes": [{ text: "cats" }, { text: "dogs" }, { text: "apples" }, { text: "bananas" }, { text: "books" }, { text: "comics" }, { text: "movies" }, { text: "TV" }, { text: "anime" }, { text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "eat": [{ text: "bananas" }, { text: "apples" }, { text: "lunch" }, { text: "breakfast" }, { text: "cakes" }],
        "eats": [{ text: "bananas" }, { text: "apples" }, { text: "lunch" }, { text: "breakfast" }, { text: "cakes" }],
        "read": [{ text: "books" }, { text: "comics" }, { text: "newspapers" }],
        "reads": [{ text: "books" }, { text: "comics" }, { text: "newspapers" }],
        "clean": [{ text: "the room" }, { text: "the desk" }, { text: "the house" }],
        "cleans": [{ text: "the room" }, { text: "the desk" }, { text: "the house" }],
        "play": [{ text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "plays": [{ text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "make": [{ text: "cakes" }, { text: "lunch" }, { text: "breakfast" }, { text: "movies" }, { text: "games" }, { text: "tea" }],
        "makes": [{ text: "cakes" }, { text: "lunch" }, { text: "breakfast" }, { text: "movies" }, { text: "games" }, { text: "tea" }],
        "study": [{ text: "English" }, { text: "math" }, { text: "science" }],
        "studies": [{ text: "English" }, { text: "math" }, { text: "science" }],
        "watch": [{ text: "movies" }, { text: "TV" }, { text: "anime" }, { text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "watches": [{ text: "movies" }, { text: "TV" }, { text: "anime" }, { text: "soccer" }, { text: "tennis" }, { text: "games" }],
        "drink": [{ text: "cola" }, { text: "tea" }, { text: "milk" }],
        "drinks": [{ text: "cola" }, { text: "tea" }, { text: "milk" }],
        "ride": [{ text: "a bike" }, { text: "a horse" }, { text: "a bus" }],
        "rides": [{ text: "a bike" }, { text: "a horse" }, { text: "a bus" }]
    };

    const TO_VERBS = {
        "go": [{ text: "school" }, { text: "park" }],
        "goes": [{ text: "school" }, { text: "park" }],
        "walk": [{ text: "school" }, { text: "park" }],
        "walks": [{ text: "school" }, { text: "park" }]
    };

    const AT_PHRASE_VERBS = {
        "study": [
            { prep: "at", place: "home" }, { prep: "at", place: "school" },
            { obj: "English", prep: "at", place: "school" }, { obj: "English", prep: "at", place: "home" },
            { obj: "math", prep: "at", place: "school" }, { obj: "math", prep: "at", place: "home" },
            { obj: "science", prep: "at", place: "school" }, { obj: "science", prep: "at", place: "home" }
        ],
        "studies": [
            { prep: "at", place: "home" }, { prep: "at", place: "school" },
            { obj: "English", prep: "at", place: "school" }, { obj: "English", prep: "at", place: "home" },
            { obj: "math", prep: "at", place: "school" }, { obj: "math", prep: "at", place: "home" },

    }

    function showLevelModal(lvl) {
        const overlay = document.getElementById('modal-overlay');

        const info = LEVEL_EXPLANATIONS[lvl];
        titleEl.innerText = info.title;
        bodyEl.innerText = info.body;

        const getBlockType = (w) => {
            if (SUBJECTS.includes(w)) return "subject";
            if (VERB_OBJECT_PAIRS[w] || TO_VERBS[w] || AT_PHRASE_VERBS[w] || INTRANSITIVE_VERBS.has(w)) return "verb";
            if (w === "to" || w === "at") return "preposition";
            return "object";
        };

        let htmlContent = "";
        info.examples.forEach(ex => {
            htmlContent += '<div class="modal-example-group"><div class="modal-example-row">';
            ex.en.forEach(w => {
                htmlContent += `<span class="modal-word-block type-${getBlockType(w)}">${w}</span>`;
            });
            htmlContent += '</div><div class="modal-example-row">';
            ex.ja.forEach(item => {
                htmlContent += `<span class="modal-word-block type-${item.type}">${item.text}</span>`;
            });
            htmlContent += '</div></div>';
        });

        examplesEl.innerHTML = htmlContent;
        overlay.classList.remove('hidden');

    function initializeBottomRows() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        activeBlocks = [];

        let levelEx = LEVEL_EXPLANATIONS[currentLevel];
        let tempTokens = [];

        levelEx.examples.forEach(ex => {
            ex.en.forEach(wordText => {
                let type = "object";
                if (SUBJECTS.includes(wordText)) type = "subject";
                else if (VERB_OBJECT_PAIRS[wordText] || TO_VERBS[wordText] || AT_PHRASE_VERBS[wordText] || INTRANSITIVE_VERBS.has(wordText)) type = "verb";
                else if (wordText === "to" || wordText === "at") type = "preposition";
                tempTokens.push({ text: wordText, type: type });
            });
        });

        let totalBlocksNeeded = 2 * COLS;
        while (tempTokens.length < totalBlocksNeeded) {
            let triplet = generateRandomBlockToken();
            tempTokens.push(...triplet);
        }
        tempTokens = tempTokens.slice(0, totalBlocksNeeded);
        tempTokens.sort(() => Math.random() - 0.5);

        let tokenIdx = 0;
        for (let r = ROWS - 2; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let wordData = tempTokens[tokenIdx++];
                let newBlock = {
                    instanceId: 'b_' + Math.random().toString(36).substring(2, 9),
                    ...wordData,
                    col: c,
                    row: r
                };
                grid[r][c] = newBlock;
                activeBlocks.push(newBlock);
            }
        }
    }

            if (timeLeft === 60 && !triggered1Min) {

    function generateRandomBlockToken() {
        let subj = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
        let is3rd = THIRD_PERSON_SUBJECTS.has(subj);
        let tokens = [{ text: subj, type: "subject" }];

        let useAtPhrase = (currentLevel >= 3 && Math.random() < 0.35);

        if (useAtPhrase) {
            let atVerbs = Object.keys(AT_PHRASE_VERBS).filter(v => is3rd ? isThirdPersonVerb(v) : !isThirdPersonVerb(v));
            let v = atVerbs[Math.floor(Math.random() * atVerbs.length)];
            let phraseInfo = AT_PHRASE_VERBS[v][Math.floor(Math.random() * AT_PHRASE_VERBS[v].length)];

            tokens.push({ text: v, type: "verb" });
            if (phraseInfo.obj) tokens.push({ text: phraseInfo.obj, type: "object" });
            tokens.push({ text: phraseInfo.prep, type: "preposition" });
            tokens.push({ text: phraseInfo.place, type: "object" });
        } else {
            let isToSentence = (currentLevel >= 2 && Math.random() < 0.35);
            if (isToSentence) {
                let toVerbs = Object.keys(TO_VERBS).filter(v => is3rd ? isThirdPersonVerb(v) : !isThirdPersonVerb(v));
                let chosenVerb = toVerbs[Math.floor(Math.random() * toVerbs.length)];
                tokens.push({ text: chosenVerb, type: "verb" });
                tokens.push({ text: "to", type: "preposition" });
                let objData = TO_VERBS[chosenVerb][Math.floor(Math.random() * TO_VERBS[chosenVerb].length)];
                tokens.push({ text: objData.text, type: "object" });
            } else {
                let standardVerbs = Object.keys(VERB_OBJECT_PAIRS).filter(v => is3rd ? isThirdPersonVerb(v) : !isThirdPersonVerb(v));
                let chosenVerb = standardVerbs[Math.floor(Math.random() * standardVerbs.length)];
                tokens.push({ text: chosenVerb, type: "verb" });

                if (!INTRANSITIVE_VERBS.has(chosenVerb)) {
                    let possibleObjs = VERB_OBJECT_PAIRS[chosenVerb];
                    if (possibleObjs && possibleObjs.length > 0) {
                        let objData = possibleObjs[Math.floor(Math.random() * possibleObjs.length)];
                        tokens.push({ text: objData.text, type: "object" });
                    }
                }
            }
        }
        tokens.sort(() => Math.random() - 0.5);
        return tokens;
    }

    function spawnBlock() {
        if (spawnerQueue.length === 0) {
            let levelEx = LEVEL_EXPLANATIONS[currentLevel];
            if (levelEx && levelEx.examples.length > 0 && Math.random() < 0.4) {
                let randomEx = levelEx.examples[Math.floor(Math.random() * levelEx.examples.length)];
                spawnerQueue = randomEx.en.map(wordText => {
                    let type = "object";
                    if (SUBJECTS.includes(wordText)) type = "subject";
                    else if (VERB_OBJECT_PAIRS[wordText] || TO_VERBS[wordText] || AT_PHRASE_VERBS[wordText] || INTRANSITIVE_VERBS.has(wordText)) type = "verb";
                    else if (wordText === "to" || wordText === "at") type = "preposition";
                    return { text: wordText, type: type };
                });
            } else {
                spawnerQueue = generateRandomBlockToken();
            }
        }

        let availableCols = [];
        for(let c=0; c<COLS; c++) {
            if (grid[0][c] === null) availableCols.push(c);
        }

        if (availableCols.length === 0) {
            triggerGameOver("GAME OVER", false);
            return;
        }

        let targetCol = availableCols[Math.floor(Math.random() * availableCols.length)];
        let targetRow = -1;
        for(let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][targetCol] === null) {
                targetRow = r;
                break;
            }
        }

        if (targetRow === -1) {
            triggerGameOver("GAME OVER", false);
            return;
        }

        let wordData = spawnerQueue.shift();
        let newBlock = {
            instanceId: 'b_' + Math.random().toString(36).substring(2, 9),
            ...wordData,
            col: targetCol,
            row: targetRow
        };

        grid[targetRow][targetCol] = newBlock;
        activeBlocks.push(newBlock);
        renderGame();
    }

    function applyGravity() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        for(let c=0; c<COLS; c++) {
            let colBlocks = activeBlocks.filter(b => b.col === c);
            colBlocks.sort((a,b) => b.row - a.row);
            let writeRow = ROWS - 1;
            for(let block of colBlocks) {
                block.row = writeRow;
                grid[writeRow][c] = block;
                writeRow--;
            }
        }
    }

    function renderGame() {
        const matrix = document.getElementById('tetris-matrix');
        matrix.querySelectorAll('.word-block').forEach(b => b.remove());

        let matrixWidth = matrix.clientWidth;
        let matrixHeight = matrix.clientHeight;
        let cellWidth = matrixWidth / COLS;
        let cellHeight = matrixHeight / ROWS;

        activeBlocks.forEach(block => {
            const el = document.createElement('div');
            el.className = `word-block type-${block.type}`;
            el.innerText = block.text;

            el.style.left = (block.col * cellWidth) + 3 + 'px';
            el.style.top = (block.row * cellHeight) + 3 + 'px';
            el.style.width = (cellWidth - 6) + 'px';
            el.style.height = (cellHeight - 6) + 'px';

            el.addEventListener('click', () => {
                let index = activeBlocks.findIndex(b => b.instanceId === block.instanceId);
                if (index !== -1) {
                    let movedBlock = activeBlocks.splice(index, 1)[0];
                    shelfTiles.push(movedBlock);
                    applyGravity();
                    renderGame();
                }
            });

            matrix.appendChild(el);
        });

        const zoneEl = document.getElementById('sentence-zone');
        zoneEl.innerHTML = '';
        if (shelfTiles.length === 0) {
            zoneEl.innerHTML = '<span class="drop-zone-placeholder">ブロックをタップして英文を組み立てる...</span>';
        } else {
            shelfTiles.forEach(tile => {
                const el = document.createElement('div');
                el.className = `shelf-tile type-${tile.type}`;
                el.innerText = tile.text;
                
                el.addEventListener('click', () => {
                    let index = shelfTiles.findIndex(t => t.instanceId === tile.instanceId);
                    if (index !== -1) {
                        let returnedBlock = shelfTiles.splice(index, 1)[0];
                        activeBlocks.push(returnedBlock);
                        applyGravity();
                        renderGame();
                    }
                });

                zoneEl.appendChild(el);
            });
        }

        document.getElementById('height-display').innerText = `ブロック数: ${activeBlocks.length}`;
    }

    function clearShelf() {
        if (shelfTiles.length === 0) return;
        activeBlocks.push(...shelfTiles);
        shelfTiles = [];
        applyGravity();
        renderGame();
        document.getElementById('feedback-msg').innerText = '';
    }

    function validateGrammarRules(tiles) {
        if (tiles.length < 2) return { valid: false, message: "文が短すぎます。" };

        const subj = tiles[0];
        const verb = tiles[1];

        if (subj.type !== 'subject') return { valid: false, message: "文は主語から始めなければなりません。" };
        if (verb.type !== 'verb') return { valid: false, message: "2番目の単語は動詞である必要があります。" };

        let is3rdSubj = THIRD_PERSON_SUBJECTS.has(subj.text);
        let is3rdVerb = isThirdPersonVerb(verb.text);

        if (is3rdSubj && !is3rdVerb) return { valid: false, message: "主語がHe, Sheなどのときは、動詞に `-s` をつけよう！" };
        if (!is3rdSubj && is3rdVerb) return { valid: false, message: "I, You, 複数形のときは、動詞に `-s` はつけないよ！" };

        let hasPreposition = tiles.some(t => t.type === 'preposition');

        if (TO_VERBS[verb.text] && currentLevel >= 2 && (tiles.length === 4 || (hasPreposition && tiles.some(t => t.text === "to")))) {
            if (tiles.length !== 4) return { valid: false, message: "「to」を含む4つのブロックで正しい文にしてください。" };
            if (tiles[2]?.type !== 'preposition' || tiles[2]?.text !== "to") return { valid: false, message: `「${verb.text}」の後には「to」が必要です。` };
            
            let isValidTarget = TO_VERBS[verb.text].some(target => target.text === tiles[3]?.text);
            if (!tiles[3] || tiles[3].type !== 'object' || !isValidTarget) return { valid: false, message: "目的地（場所）の単語が不自然です。" };
            return { valid: true };
        }

        if (AT_PHRASE_VERBS[verb.text] && currentLevel >= 3 && (tiles.length > 3 || hasPreposition)) {
            let validPhrases = AT_PHRASE_VERBS[verb.text];
            let matched = validPhrases.some(p => {
                let expectedPattern = [subj.text, verb.text];
                if (p.obj) expectedPattern.push(p.obj);
                expectedPattern.push(p.prep, p.place);
                if (tiles.length !== expectedPattern.length) return false;
                return tiles.every((tile, idx) => tile.text === expectedPattern[idx]);
            });

            if (matched) return { valid: true };

            if (hasPreposition) {
                let atIndex = tiles.findIndex(t => t.text === "at");
                if (atIndex !== -1 && atIndex !== tiles.length - 2) return { valid: false, message: "「at」は場所の単語の直前に置いてください。" };
                return { valid: false, message: "この場所でその行動は不自然です。" };
            }
            return { valid: false, message: "「at」の位置や場所の単語が正しくありません。" };
        }

        if (INTRANSITIVE_VERBS.has(verb.text)) return { valid: false, message: `このレベルでは「${verb.text}」の単独文は登場しません。` };

        if (tiles.length < 3) return { valid: false, message: `「${verb.text}」のあとには目的語が必要です。` };
        if (tiles.length > 3) return { valid: false, message: "余分な単語が含まれています。必要のないブロックを外してください。" };

        let obj = tiles[2];
        if (!obj || obj.type !== 'object') return { valid: false, message: "3番目の単語は目的語（対象）である必要があります。" };

        if (VERB_OBJECT_PAIRS[verb.text]) {
            let validObjEntries = VERB_OBJECT_PAIRS[verb.text];
            let matchedEntry = validObjEntries.find(o => o.text === obj.text);
            if (!matchedEntry) return { valid: false, message: "自然な意味の組み合わせになりません！" };
        } else {
            return { valid: false, message: "無効な動詞です。" };
        }

        return { valid: true };
    }

    function checkAnswer() {
        const feedbackEl = document.getElementById('feedback-msg');
        const result = validateGrammarRules(shelfTiles);
        const userString = shelfTiles.map(t => t.text).join(' ');

        if (result.valid) {
            currentLevelScore += 100;
            feedbackEl.innerText = `正解！ "${userString}" (+100点)`;
            feedbackEl.className = "feedback-msg feedback-success";
            shelfTiles = [];
            renderGame();
        } else {
            feedbackEl.innerText = result.message;
            feedbackEl.className = "feedback-msg feedback-error";
        }
    }

    function triggerGameOver(message = "GAME OVER", isWin = false) {
        clearInterval(dropInterval);
        clearInterval(roundTimerInterval);

        const matrixEl = document.getElementById('tetris-matrix');
        const bannerEl = document.getElementById('game-over-banner');
        matrixEl.classList.add('game-over-overlay');
        bannerEl.innerText = message;
        bannerEl.classList.add('show');

        showSideMessage("ゲームオーバー！次はがんばろう！");
        let failedLevel = currentLevel;

        setTimeout(() => {
            bannerEl.classList.remove('show');
            matrixEl.classList.remove('game-over-overlay');
            startGame(failedLevel);
        }, 3000);
    }
</script>
