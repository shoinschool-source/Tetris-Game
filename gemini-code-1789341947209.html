<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Word Block Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 480px;
            background-color: #16213e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #e94560;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background-color: #ff6b81;
        }

        .btn-secondary {
            background-color: #0f3460;
        }

        .btn-secondary:hover {
            background-color: #1f4068;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 14px;
            color: #00fff5;
        }

        #prominent-timer-bar {
            width: 100%;
            background-color: #e94560;
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }

        #prominent-timer-bar.visible {
            display: block;
        }

        #tetris-matrix {
            width: 360px;
            height: 600px;
            background-color: #0f3460;
            border: 2px solid #e94560;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(10, 1fr);
            overflow: hidden;
        }

        .grid-cell {
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .word-block, .shelf-tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            padding: 2px;
            word-break: break-word;
        }

        .type-subject { background-color: #4e54c8; color: #fff; }
        .type-verb { background-color: #11998e; color: #fff; }
        .type-object { background-color: #fc4a1a; color: #fff; }
        .type-preposition { background-color: #f7b731; color: #000; }

        #sentence-zone {
            width: 100%;
            min-height: 60px;
            background-color: #0f3460;
            border: 2px dashed #00fff5;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            padding: 8px;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
        }

        .drop-zone-placeholder {
            color: #888;
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        .shelf-tile {
            position: relative;
            height: 40px;
            padding: 0 12px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .controls .btn {
            flex: 1;
        }

        .feedback-msg {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
            text-align: center;
        }

        .feedback-success { color: #2ecc71; }
        .feedback-error { color: #e74c3c; }

        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 100;
        }

        .modal-content {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #00fff5;
            width: 85%;
            text-align: left;
        }

        .modal-content h2 {
            color: #00fff5;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        .game-over-overlay {
            opacity: 0.3;
        }

        #game-over-banner {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e94560;
            display: none;
            z-index: 50;
        }

        #game-over-banner.show {
            display: block;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>Word Drop Game</h1>
        <p style="margin-bottom: 20px; text-align: center; color: #aaa; font-size: 14px;">
            落ちてくる英単語ブロックをタップして<br>正しい英文を作ろう！
        </p>
        <button class="btn" onclick="startGame(1)">Start Game</button>
    </div>

    <!-- PLAY SCREEN -->
    <div id="play-screen" class="screen hidden">
        <div class="header-bar">
            <span id="level-indicator">レベル 1</span>
            <span id="score-display">SCORE: 0</span>
            <span id="height-display">ブロック数: 0</span>
        </div>

        <div id="prominent-timer-bar">
            TIME LEFT: <span id="prominent-timer-display">03:00</span>
        </div>

        <div id="tetris-matrix"></div>
        <div id="game-over-banner">GAME OVER</div>

        <div id="sentence-zone">
            <span class="drop-zone-placeholder">ブロックをタップして英文を組み立てる...</span>
        </div>

        <div class="feedback-msg" id="feedback-msg"></div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="clearShelf()">クリア</button>
            <button class="btn" onclick="checkAnswer()">判定</button>
        </div>
    </div>

    <!-- LEVEL MODAL -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">レベル 1</h2>
            <p id="modal-body"></p>
            <p id="modal-examples" style="color: #00fff5;"></p>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="closeModal()">スタート</button>
        </div>
    </div>
</div>

        ],

        ],

        ],

        ],

            { obj: "cakes", prep: "at", place: "home" }, { obj: "cakes", prep: "at", place: "school" },

        ],
        "clean": [

            { obj: "the house", prep: "at", place: "home" },
            { obj: "the desk", prep: "at", place: "school" }, { obj: "the desk", prep: "at", place: "home" }
        ],
        "cleans": [
            { obj: "the room", prep: "at", place: "home" },
            { obj: "the house", prep: "at", place: "home" },
            { obj: "the desk", prep: "at", place: "school" }, { obj: "the desk", prep: "at", place: "home" }
        ],
        "drink": [
            { obj: "tea", prep: "at", place: "home" }, { obj: "tea", prep: "at", place: "school" },
            { obj: "cola", prep: "at", place: "home" }, { obj: "cola", prep: "at", place: "school" },
            { obj: "milk", prep: "at", place: "home" }, { obj: "milk", prep: "at", place: "school" }
        ],
        "drinks": [
            { obj: "tea", prep: "at", place: "home" }, { obj: "tea", prep: "at", place: "school" },
            { obj: "cola", prep: "at", place: "home" }, { obj: "cola", prep: "at", place: "school" },
            { obj: "milk", prep: "at", place: "home" }, { obj: "milk", prep: "at", place: "school" }
        ],
        "sleep": [{ prep: "at", place: "home" }],
        "sleeps": [{ prep: "at", place: "home" }],
        "swim": [{ prep: "at", place: "school" }],
        "swims": [{ prep: "at", place: "school" }],
        "run": [{ prep: "at", place: "school" }],
        "runs": [{ prep: "at", place: "school" }]
    };

    let currentLevel = 1;
    let score = 0;
    let timeLeft = 180;
    let dropInterval = null;
    let roundTimerInterval = null;
    let spawnerQueue = [];
    let grid = [];
    let activeBlocks = [];
    let shelfTiles = [];

    const COLS = 6;
    const ROWS = 10;

    function isThirdPersonVerb(vText) {
        return vText.endsWith("s") || vText === "watches" || vText === "studies" || vText === "goes";
    }

    function formatTimerDisplay(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function showLevelModal(lvl) {
        const overlay = document.getElementById('modal-overlay');
        const titleEl = document.getElementById('modal-title');
        const bodyEl = document.getElementById('modal-body');
        const examplesEl = document.getElementById('modal-examples');

        titleEl.innerText = `レベル ${lvl}`;

        if (lvl === 1) {
            bodyEl.innerText = "【クリア条件】\n800ポイント（8文完成）でレベル2へ！\nボードがあふれないように正しい英文を作ろう。";
            examplesEl.innerText = "【作成できる文の種類と例】\n" +
                "■ SVO（主語＋動詞＋目的語）\n" +
                "・原形: I play soccer / They eat bananas\n" +
                "・sあり: Ken likes cats / She eats apples";
        } else if (lvl === 2) {
            bodyEl.innerText = "【クリア条件】\n800ポイント（8文完成）でレベル3へ！\n落下スピードがアップし「to」を使った表現が登場！";
            examplesEl.innerText = "【作成できる文の種類と例】\n" +
                "■ SVO（主語＋動詞＋目的語）\n" +
                "・原形: We read books\n" +
                "・sあり: Yumi reads comics\n\n" +
                "■ 自動詞 SV（主語＋動詞）\n" +
                "・原形: You swim\n" +
                "・sあり: He swims\n\n" +
                "■ to ＋ 目的地\n" +
                "・原形: I go to school / They walk to park\n" +
                "・sあり: She goes to school / Ken walks to park";
        } else if (lvl === 3) {
            bodyEl.innerText = "【クリア条件】\n3分間（180秒）生き残ればステージクリア！\n「at」を使った場所の表現も登場！";
            examplesEl.innerText = "【作成できる文の種類と例】\n" +
                "■ at ＋ 場所\n" +
                "・原形: They study at school / We watch TV at home\n" +
                "・sあり: He studies at home / She watches TV at home\n\n" +
                "■ SVO ＆ 自動詞 SV\n" +
                "・原形: The boys drink milk / They sleep\n" +
                "・sあり: The teacher drinks tea / Yumi sleeps\n\n" +
                "■ to ＋ 目的地\n" +
                "・原形: Tom and Bob go to school\n" +
                "・sあり: She goes to school";
        }

        overlay.classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
    }

    function updateDropSpeed() {
        if (dropInterval) clearInterval(dropInterval);
        let dropSpeed = 3000;
        if (currentLevel === 2) dropSpeed = 2000;
        if (currentLevel >= 3) dropSpeed = 1500;

        dropInterval = setInterval(() => {
            spawnBlock();
        }, dropSpeed);
    }

    function initializeBottomRows() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        activeBlocks = [];

        let totalBlocksNeeded = 2 * COLS;
        let tempTokens = [];
        while (tempTokens.length < totalBlocksNeeded) {
            let triplet = generateRandomBlockToken();
            tempTokens.push(...triplet);
        }
        tempTokens = tempTokens.slice(0, totalBlocksNeeded);

        let tokenIdx = 0;
        for (let r = ROWS - 2; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let wordData = tempTokens[tokenIdx++];
                let newBlock = {
                    instanceId: 'b_' + Math.random().toString(36).substring(2, 9),
                    ...wordData,
                    col: c,
                    row: r
                };
                grid[r][c] = newBlock;
                activeBlocks.push(newBlock);
            }
        }
    }

    function startGame(startLevel = 1) {
        currentLevel = startLevel;
        timeLeft = 180;

        if (currentLevel === 1) {
            score = 0;
        } else if (currentLevel === 2) {
            score = 800;
        } else if (currentLevel === 3) {
            score = 1600;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        document.getElementById('level-indicator').innerText = `レベル ${currentLevel}`;
        
        if (currentLevel === 3) {
            startLevel3Timer();
        } else {
            document.getElementById('prominent-timer-bar').classList.remove('visible');
        }

        const matrixEl = document.getElementById('tetris-matrix');
        const bannerEl = document.getElementById('game-over-banner');
        matrixEl.classList.remove('game-over-overlay');
        bannerEl.classList.remove('show');

        shelfTiles = [];
        spawnerQueue = [];

        buildMatrixGridUI();
        initializeBottomRows();
        renderGame();

        if (roundTimerInterval && currentLevel !== 3) clearInterval(roundTimerInterval);
        updateDropSpeed();

        showLevelModal(currentLevel);
    }

    function startLevel3Timer() {
        timeLeft = 180;
        const timerBar = document.getElementById('prominent-timer-bar');
        const timerEl = document.getElementById('prominent-timer-display');
        
        timerBar.classList.add('visible');
        timerEl.innerText = formatTimerDisplay(timeLeft);

        if (roundTimerInterval) clearInterval(roundTimerInterval);
        roundTimerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = formatTimerDisplay(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(roundTimerInterval);
                triggerGameOver("STAGE CLEAR! YOU WIN!", true);
            }
        }, 1000);
    }

    function buildMatrixGridUI() {
        const matrix = document.getElementById('tetris-matrix');
        matrix.innerHTML = '';
        for(let r=0; r<ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                matrix.appendChild(cell);
            }
        }
    }

    function generateRandomBlockToken() {
        let subj = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
        let is3rd = THIRD_PERSON_SUBJECTS.has(subj);
        let tokens = [{ text: subj, type: "subject" }];

        let useAtPhrase = (currentLevel >= 3 && Math.random() < 0.35);

        if (useAtPhrase) {
            let atVerbs = Object.keys(AT_PHRASE_VERBS).filter(v => {
                let is3rdV = isThirdPersonVerb(v);
                return is3rd ? is3rdV : !is3rdV;
            });
            let v = atVerbs[Math.floor(Math.random() * atVerbs.length)];
            let possiblePhrases = AT_PHRASE_VERBS[v];
            let phraseInfo = possiblePhrases[Math.floor(Math.random() * possiblePhrases.length)];

            tokens.push({ text: v, type: "verb" });
            
            if (phraseInfo.obj) {
                tokens.push({ text: phraseInfo.obj, type: "object" });
            }
            
            tokens.push({ text: phraseInfo.prep, type: "preposition" });
            tokens.push({ text: phraseInfo.place, type: "object" });
        } else {
            let chosenVerb;
            let isToSentence = false;

            if (currentLevel >= 2) {
                isToSentence = Math.random() < 0.35;
            }

            if (isToSentence) {
                let toVerbs = Object.keys(TO_VERBS).filter(v => {
                    let is3rdV = isThirdPersonVerb(v);
                    return is3rd ? is3rdV : !is3rdV;
                });
                chosenVerb = toVerbs[Math.floor(Math.random() * toVerbs.length)];

                tokens.push({ text: chosenVerb, type: "verb" });
                tokens.push({ text: "to", type: "preposition" });
                
                let possibleObjs = TO_VERBS[chosenVerb];
                let objData = possibleObjs[Math.floor(Math.random() * possibleObjs.length)];
                tokens.push({ text: objData.text, type: "object" });
            } else {
                let standardVerbs = Object.keys(VERB_OBJECT_PAIRS).filter(v => {
                    let is3rdVerb = isThirdPersonVerb(v);
                    return is3rd ? is3rdVerb : !is3rdVerb;
                });

                if (currentLevel >= 2) {
                    let intransitiveFiltered = Array.from(INTRANSITIVE_VERBS).filter(v => {
                        let is3rdVerb = isThirdPersonVerb(v);
                        return is3rd ? is3rdVerb : !is3rdVerb;
                    });
                    standardVerbs = standardVerbs.concat(intransitiveFiltered);
                }

                chosenVerb = standardVerbs[Math.floor(Math.random() * standardVerbs.length)];

                tokens.push({ text: chosenVerb, type: "verb" });

                if (!INTRANSITIVE_VERBS.has(chosenVerb)) {
                    let possibleObjs = VERB_OBJECT_PAIRS[chosenVerb];
                    if (possibleObjs && possibleObjs.length > 0) {
                        let objData = possibleObjs[Math.floor(Math.random() * possibleObjs.length)];
                        tokens.push({ text: objData.text, type: "object" });
                    }
                }
            }
        }

        tokens.sort(() => Math.random() - 0.5);
        return tokens;
    }

    function spawnBlock() {
        if (spawnerQueue.length === 0) {
            spawnerQueue = generateRandomBlockToken();
        }

        let availableCols = [];
        for(let c=0; c<COLS; c++) {
            if (grid[0][c] === null) availableCols.push(c);
        }

        if (availableCols.length === 0) {
            triggerGameOver("GAME OVER", false);
            return;
        }

        let targetCol = availableCols[Math.floor(Math.random() * availableCols.length)];
        let targetRow = -1;
        for(let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][targetCol] === null) {
                targetRow = r;
                break;
            }
        }

        if (targetRow === -1) {
            triggerGameOver("GAME OVER", false);
            return;
        }

        let wordData = spawnerQueue.shift();
        let newBlock = {
            instanceId: 'b_' + Math.random().toString(36).substring(2, 9),
            ...wordData,
            col: targetCol,
            row: targetRow
        };

        grid[targetRow][targetCol] = newBlock;
        activeBlocks.push(newBlock);
        renderGame();
    }

    function applyGravity() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        for(let c=0; c<COLS; c++) {
            let colBlocks = activeBlocks.filter(b => b.col === c);
            colBlocks.sort((a,b) => b.row - a.row);
            let writeRow = ROWS - 1;
            for(let block of colBlocks) {
                block.row = writeRow;
                grid[writeRow][c] = block;
                writeRow--;
            }
        }
    }

    function renderGame() {
        const matrix = document.getElementById('tetris-matrix');
        matrix.querySelectorAll('.word-block').forEach(b => b.remove());

        let matrixWidth = matrix.clientWidth;
        let matrixHeight = matrix.clientHeight;
        let cellWidth = matrixWidth / COLS;
        let cellHeight = matrixHeight / ROWS;

        activeBlocks.forEach(block => {
            const el = document.createElement('div');
            el.className = `word-block type-${block.type}`;
            el.innerText = block.text;

            el.style.left = (block.col * cellWidth) + 4 + 'px';
            el.style.top = (block.row * cellHeight) + 4 + 'px';
            el.style.width = (cellWidth - 8) + 'px';
            el.style.height = (cellHeight - 8) + 'px';

            el.addEventListener('click', () => {
                let index = activeBlocks.findIndex(b => b.instanceId === block.instanceId);
                if (index !== -1) {
                    let movedBlock = activeBlocks.splice(index, 1)[0];
                    shelfTiles.push(movedBlock);
                    applyGravity();
                    renderGame();
                }
            });

            matrix.appendChild(el);
        });

        const zoneEl = document.getElementById('sentence-zone');
        zoneEl.innerHTML = '';
        if (shelfTiles.length === 0) {
            zoneEl.innerHTML = '<span class="drop-zone-placeholder">ブロックをタップして英文を組み立てる...</span>';
        } else {
            shelfTiles.forEach(tile => {
                const el = document.createElement('div');
                el.className = `shelf-tile type-${tile.type}`;
                el.innerText = tile.text;
                
                el.addEventListener('click', () => {
                    let index = shelfTiles.findIndex(t => t.instanceId === tile.instanceId);
                    if (index !== -1) {
                        let returnedBlock = shelfTiles.splice(index, 1)[0];
                        activeBlocks.push(returnedBlock);
                        applyGravity();
                        renderGame();
                    }
                });

                zoneEl.appendChild(el);
            });
        }

        document.getElementById('score-display').innerText = `SCORE: ${score}`;
        document.getElementById('height-display').innerText = `ブロック数: ${activeBlocks.length}`;
    }

    function clearShelf() {
        if (shelfTiles.length === 0) return;
        activeBlocks.push(...shelfTiles);
        shelfTiles = [];
        applyGravity();
        renderGame();
        document.getElementById('feedback-msg').innerText = '';
    }

    function validateGrammarRules(tiles) {
        if (tiles.length < 2) return { valid: false, message: "文が短すぎます。" };

        const subj = tiles[0];
        const verb = tiles[1];

        if (subj.type !== 'subject') return { valid: false, message: "文は主語から始めなければなりません。" };
        if (verb.type !== 'verb') return { valid: false, message: "2番目の単語は動詞である必要があります。" };

        let is3rdSubj = THIRD_PERSON_SUBJECTS.has(subj.text);
        let is3rdVerb = isThirdPersonVerb(verb.text);

        if (is3rdSubj && !is3rdVerb) {
            return { valid: false, message: "主語がHe, Sheなどの単数形のときは、動詞に `-s` をつけよう！" };
        }
        if (!is3rdSubj && is3rdVerb) {
            return { valid: false, message: "I, You, They, 複数形のときは、動詞に `-s` はつけないよ！" };
        }

        let hasPreposition = tiles.some(t => t.type === 'preposition');

        if (TO_VERBS[verb.text] && currentLevel >= 2 && (tiles.length === 4 || (hasPreposition && tiles.some(t => t.text === "to")))) {
            if (tiles.length !== 4) return { valid: false, message: "「to」を含む4つのブロックで正しい文にしてください。" };
            if (tiles[2]?.type !== 'preposition' || tiles[2]?.text !== "to") {
                return { valid: false, message: `「${verb.text}」の後には「to」が必要です。` };
            }
            
            let isValidTarget = TO_VERBS[verb.text].some(target => target.text === tiles[3]?.text);
            if (!tiles[3] || tiles[3].type !== 'object' || !isValidTarget) {
                return { valid: false, message: "目的地（場所）の単語が不自然です。" };
            }
            return { valid: true };
        }

        if (AT_PHRASE_VERBS[verb.text] && currentLevel >= 3 && (tiles.length > 3 || hasPreposition)) {
            let validPhrases = AT_PHRASE_VERBS[verb.text];
            
            let matched = validPhrases.some(p => {
                let expectedPattern = [subj.text, verb.text];
                if (p.obj) expectedPattern.push(p.obj);
                expectedPattern.push(p.prep, p.place);

                if (tiles.length !== expectedPattern.length) return false;
                return tiles.every((tile, idx) => tile.text === expectedPattern[idx]);
            });

            if (matched) return { valid: true };

            if (hasPreposition) {
                let atIndex = tiles.findIndex(t => t.text === "at");
                if (atIndex !== -1 && atIndex !== tiles.length - 2) {
                    return { valid: false, message: "「at」は場所の単語の直前に置いてください。" };
                }
                return { valid: false, message: "この場所でその行動は不自然です。" };
            }

            return { valid: false, message: "「at」の位置や場所の単語が正しくありません。" };
        }

        if (INTRANSITIVE_VERBS.has(verb.text)) {
            if (currentLevel < 2) {
                return { valid: false, message: `「${verb.text}」はこのレベルでは登場しません。` };
            }
            if (tiles.length !== 2) return { valid: false, message: `「${verb.text}」のあとに目的語は必要ありません。` };
            return { valid: true };
        }

        if (tiles.length < 3) {
            return { valid: false, message: `「${verb.text}」のあとには目的語が必要です。` };
        }
        
        if (tiles.length > 3) {
            return { valid: false, message: "余分な単語が含まれています。必要のないブロックを外してください。" };
        }

        let obj = tiles[2];
        if (!obj || obj.type !== 'object') return { valid: false, message: "3番目の単語は目的語（対象）である必要があります。" };

        if (VERB_OBJECT_PAIRS[verb.text]) {
            let validObjEntries = VERB_OBJECT_PAIRS[verb.text];
            let matchedEntry = validObjEntries.find(o => o.text === obj.text);
            
            if (!matchedEntry) {
                return { valid: false, message: "自然な意味の組み合わせになりません！" };
            }
        } else {
            return { valid: false, message: "無効な動詞です。" };
        }

        return { valid: true };
    }

    function checkAnswer() {
        const feedbackEl = document.getElementById('feedback-msg');
        const result = validateGrammarRules(shelfTiles);
        const userString = shelfTiles.map(t => t.text).join(' ');

        if (result.valid) {
            score += 100;
            feedbackEl.innerText = `正解！ "${userString}" (+100点)`;
            feedbackEl.className = "feedback-msg feedback-success";

            shelfTiles = [];

            let targetLevel = currentLevel;
            if (score >= 1600) {
                targetLevel = 3;
            } else if (score >= 800) {
                targetLevel = 2;
            }

            if (targetLevel > currentLevel) {
                currentLevel = targetLevel;
                document.getElementById('level-indicator').innerText = `レベル ${currentLevel}`;
                updateDropSpeed();
                initializeBottomRows();
                showLevelModal(currentLevel);

                if (currentLevel === 3) {
                    startLevel3Timer();
                }
            }

            renderGame();
        } else {
            feedbackEl.innerText = result.message;
            feedbackEl.className = "feedback-msg feedback-error";
        }
    }

    function triggerGameOver(message = "GAME OVER", isWin = false) {
        clearInterval(dropInterval);
        clearInterval(roundTimerInterval);

        const matrixEl = document.getElementById('tetris-matrix');
        const bannerEl = document.getElementById('game-over-banner');
        matrixEl.classList.add('game-over-overlay');
        bannerEl.innerText = message;
        bannerEl.classList.add('show');

        let failedLevel = currentLevel;

        setTimeout(() => {
            bannerEl.classList.remove('show');
            matrixEl.classList.remove('game-over-overlay');
            
            if (isWin) {
                // If they cleared level 3, they can loop back or restart level 3
                startGame(3);
            } else {
                // Instantly restart from the exact same level they failed on without going to start screen
                startGame(failedLevel);
            }
        }, 3000);
    }
</script>
